*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45}
a{color:inherit}

.ic{flex:none;display:block}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}

.nav a .ic{opacity:.85}
.nav .lbl{flex:1;min-width:0}
.nav .bdg{font-size:10.5px;font-weight:700;min-width:19px;height:19px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--crit);color:#fff}
.nav .bdg.w{background:var(--brand-2);color:var(--brand-deep)}
.side-foot{margin-top:auto;padding:14px 16px;font-size:11px;color:var(--nav-muted);border-top:1px solid rgba(255,255,255,.08)}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:12}
.crumbs{display:flex;flex-direction:column;min-width:0;flex:1}
.crumbs small{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{font-family:var(--cond);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;min-width:260px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--muted);cursor:pointer}
.searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;background:var(--surface)}
.ctx{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.ctx select{border:0;background:transparent;height:34px;max-width:210px;font-weight:600;cursor:pointer}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}

.iconbtn .dotn{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px}

.me div{display:flex;flex-direction:column;line-height:1.2}
.me small{font-size:11px;color:var(--muted)}
.menubtn{display:none}

.page{padding:20px 22px 64px;display:flex;flex-direction:column;gap:16px;width:100%;max-width:1480px}
.ctxbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--brand-soft);border:1px solid var(--line);font-size:12.5px}

/* page header */
.ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.ph h1{margin:0;font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:-.005em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);max-width:80ch}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}

.cnt{font-size:11px;font-weight:700;padding:0 6px;border-radius:9px;background:var(--surface-3);color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pchip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.card-h h2{margin:0;font-size:14.5px;font-weight:700;text-wrap:balance}
.card-h p{margin:0;font-size:12px;color:var(--muted)}
.card-b{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-b.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.kpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpis>.kpi{flex:1 1 150px}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kbtn{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.kbtn:hover{background:var(--surface-2)}
.kbtn:focus-visible{outline-offset:-2px}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

/* pills & bars */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;background:var(--neu-bg);color:var(--neu)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.info{background:var(--info)}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)} .bar i.neu{background:var(--line-2)}
.barcell{display:flex;align-items:center;gap:8px;min-width:120px}
.barcell span{font-size:12px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.sem{display:inline-flex;gap:4px}

/* data table */
.dt{display:flex;flex-direction:column;min-width:0}
.dt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px 14px;border-bottom:1px solid var(--line)}
.dt-search{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);flex:1 1 220px;min-width:0;color:var(--muted)}
.dt-search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--ink);height:32px}
.dt-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fsel{display:flex;flex-direction:column;gap:2px}
.fsel span{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.fsel select{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;max-width:190px;cursor:pointer}
.dt-tools{margin-left:auto;display:flex;gap:8px}
.dt-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.dt-meta b{color:var(--ink)}
.dt-sum{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.dt-sum b{font-variant-numeric:tabular-nums}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:1px 8px;font-size:11.5px;cursor:pointer}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px;height:36px;border-bottom:1px solid var(--line);white-space:nowrap}
.th{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.th:hover{color:var(--ink)}
.sarr{color:var(--brand);min-width:8px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right} th.r .th{flex-direction:row-reverse}
td.c,th.c{text-align:center}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.click:focus-visible{outline:2px solid var(--brand-2);outline-offset:-2px}
tr.flag td{background:var(--crit-bg)} tr.flagw td{background:var(--warn-bg)}
tr.flag.click:hover td{background:var(--crit-bg)} tr.flagw.click:hover td{background:var(--warn-bg)}
td .t1{font-weight:600;display:block}
td .t2{font-size:11.5px;color:var(--muted);display:block}
td.empty{padding:36px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.plain td,.plain th{position:static}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{height:36px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);padding:0 10px;width:100%}
.field textarea{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.qty{width:86px;height:30px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 8px;text-align:right}

/* misc blocks */
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line)}
.note.crit{background:var(--crit-bg);border-color:transparent} .note.warn{background:var(--warn-bg);border-color:transparent} .note.ok{background:var(--ok-bg);border-color:transparent} .note.info{background:var(--info-bg);border-color:transparent}
.note .ic{margin-top:1px}
.note.crit .ic{color:var(--crit)} .note.warn .ic{color:var(--warn)} .note.ok .ic{color:var(--ok)} .note.info .ic{color:var(--info)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:7px 14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.aitem .sv{align-self:stretch;border-radius:2px;background:var(--line-2)}
.aitem .sv.crit{background:var(--crit)} .aitem .sv.warn{background:var(--warn)} .aitem .sv.info{background:var(--info)}
.aitem b{display:block;font-size:13px;font-weight:600}

const TB={};
function dtSet(id,patch){const t=TB[id]||(TB[id]={st:{q:'',f:{},sort:null,page:0}});Object.assign(t.st.f,patch.f||{});if(patch.q!=null)t.st.q=patch.q;t.st.page=0}
function dt(id,cfg){
 const t=TB[id]||(TB[id]={st:{q:'',f:{},sort:cfg.sort?{...cfg.sort}:null,page:0}});
 if(!t.st.sort&&cfg.sort)t.st.sort={...cfg.sort};
 t.cfg=cfg;const base=cfg.rows();
 const fl=(cfg.filters||[]).map(f=>{const opts=f.options||[...new Set(base.map(f.get).filter(v=>v!==''&&v!=null))].sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}));
  return `<label class="fsel"><span>${f.label}</span><select id="${id}-f-${f.k}" data-dtf="${id}" data-k="${f.k}"><option value="">Todos</option>${opts.map(o=>`<option ${String(t.st.f[f.k]??'')===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}).join('');
 return `<div class="dt"><div class="dt-bar"><label class="dt-search">${ic('search',16)}<input id="${id}-q" type="search" data-dtq="${id}" placeholder="${esc(cfg.ph||'Buscar…')}" value="${esc(t.st.q)}" autocomplete="off" aria-label="Buscar en la tabla"></label>${fl}<span class="dt-tools">${cfg.tools||''}${btn(ic('download',16)+'Excel','dtXls',{id},'sm','aria-label="Exportar a Excel con los filtros aplicados"')}</span></div><div class="dt-meta" id="${id}-meta">${dtMeta(id)}</div><div id="${id}-body">${dtBody(id)}</div></div>`;
}
function dtRows(id){const t=TB[id],c=t.cfg,s=t.st;let r=c.rows();const q=norm(s.q.trim());
 if(q){const ws=q.split(/\s+/);r=r.filter(x=>{const tx=norm(c.text(x));return ws.every(w=>tx.includes(w))})}
 for(const f of c.filters||[]){const v=s.f[f.k];if(v)r=r.filter(x=>String(f.get(x))===v)}
 if(s.sort){const col=c.cols.find(k=>k.k===s.sort.k);if(col){const g=col.sv||(x=>x[col.k]);r=[...r].sort((a,b)=>{const A=g(a),B=g(b);return (typeof A==='string'?A.localeCompare(B,'es',{numeric:true}):(A-B))*s.sort.d})}}
 return r}
function dtMeta(id){const t=TB[id],c=t.cfg,s=t.st,r=dtRows(id),total=c.rows().length;
 const chips=Object.entries(s.f).filter(([k,v])=>v&&(c.filters||[]).some(x=>x.k===k)).map(([k,v])=>{const f=c.filters.find(x=>x.k===k);return `<button class="fchip" data-act="dtRm" data-id="${id}" data-k="${k}" aria-label="Quitar filtro ${esc(f.label)}">${esc(f.label)}: ${esc(v)} ${ic('x',12)}</button>`}).join('');
 return `<span><b>${fmt(r.length)}</b> de ${fmt(total)} ${c.noun||'registros'}</span>${chips}${chips||s.q?`<button class="linkbtn" data-act="dtClr" data-id="${id}">Limpiar filtros</button>`:''}${c.summary?`<span class="dt-sum">${c.summary(r)}</span>`:''}`}
function dtBody(id){const t=TB[id],c=t.cfg,s=t.st,r=dtRows(id);t.last=r;const ps=c.pageSize||20,pages=Math.max(1,Math.ceil(r.length/ps));if(s.page>=pages)s.page=pages-1;if(s.page<0)s.page=0;const sl=r.slice(s.page*ps,s.page*ps+ps);
 const head=c.cols.map(col=>{const on=s.sort&&s.sort.k===col.k;return `<th class="${col.cls||''}"${on?` aria-sort="${s.sort.d>0?'ascending':'descending'}"`:''}>${col.nosort?col.label:`<button class="th" data-act="dtSort" data-id="${id}" data-k="${col.k}">${col.label}<span class="sarr">${on?(s.sort.d>0?'↑':'↓'):''}</span></button>`}</th>`}).join('');
 const body=sl.length?sl.map((x,i)=>`<tr class="${c.rowCls?c.rowCls(x):''}${c.onRow?' click':''}"${c.onRow?` data-act="dtRow" data-id="${id}" data-i="${s.page*ps+i}" tabindex="0"`:''}>${c.cols.map(col=>`<td class="${col.cls||''}" data-l="${esc(String(col.label).replace(/<[^>]*>/g,''))}"><div class="cv">${col.r?col.r(x):esc(x[col.k])}</div></td>`).join('')}</tr>`).join(''):`<tr><td colspan="${c.cols.length}" class="empty">${c.empty||'No hay resultados con esta búsqueda o estos filtros.'}</td></tr>`;
 return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${pages>1?`<div class="pager"><span>${fmt(s.page*ps+1)}–${fmt(Math.min(r.length,(s.page+1)*ps))} de ${fmt(r.length)}</span>${btn('Anterior','dtPage',{id,d:-1},'sm',s.page===0?'disabled':'')}${btn('Siguiente','dtPage',{id,d:1},'sm',s.page>=pages-1?'disabled':'')}</div>`:''}`}

function lineChart({series,labels,max,ticks,unit='',w=720,h=230,marker,min=0}){const l=46,r=18,t=14,b=30;const n=labels.length;const x=i=>l+i*(w-l-r)/(n-1),y=v=>t+(max-v)*(h-t-b)/(max-min);
 let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:480px" role="img" aria-label="${esc(series.map(z=>z.name).join(' y '))}">`;
 ticks.forEach(v=>{s+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}${unit}</text>`});
 const step=Math.ceil(n/8);labels.forEach((lb,i)=>{if(i%step===0||i===n-1)s+=`<text x="${x(i)}" y="${h-9}" text-anchor="middle" font-size="11" fill="var(--muted)">${lb}</text>`});
 if(marker!=null)s+=`<line x1="${x(marker)}" x2="${x(marker)}" y1="${t}" y2="${y(min)}" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="${x(marker)+6}" y="${t+10}" font-size="11" fill="var(--muted)">Hoy</text>`;
 series.forEach(z=>{const pts=z.v.map((v,i)=>`${x(i)},${y(v)}`).join(' ');if(z.area)s+=`<polygon points="${x(0)},${y(min)} ${pts} ${x(z.v.length-1)},${y(min)}" fill="${z.color}" fill-opacity=".12"/>`;s+=`<polyline points="${pts}" fill="none" stroke="${z.color}" stroke-width="${z.dash?1.6:2.4}" ${z.dash?'stroke-dasharray="5 4"':''}/>`;if(z.end){const k=z.v.length-1;s+=`<circle cx="${x(k)}" cy="${y(z.v[k])}" r="4.5" fill="${z.color}"/><text x="${x(k)+(k>n*0.8?-8:8)}" y="${y(z.v[k])+(z.below?18:-8)}" text-anchor="${k>n*0.8?'end':'start'}" font-size="12" font-weight="700" fill="var(--ink)">${z.end}</text>`}});
 return `<div class="tw">${s}</svg></div>`}
function curva(pid){const c=CURVES[pid];if(!c)return note('','Este proyecto aún no tiene cronograma de obra.');const lbl=c.plan.map((_,i)=>'S'+(i+1));const k=c.real.length-1;return lineChart({series:[{name:'Planeado',v:c.plan,color:'var(--muted)',dash:true},{name:'Real',v:c.real,color:'var(--brand)',area:true,end:c.real[k]+' % real · '+c.plan[k]+' % plan',below:true}],labels:lbl,max:100,ticks:[0,25,50,75,100],unit:' %',marker:k})+`<div class="legend"><span><i></i>Real</span><span><i style="background:var(--muted)"></i>Planeado</span></div>`}
function spark(h,w=110,hh=26){const mn=Math.min(...h),mx=Math.max(...h);const x=i=>3+i*(w-6)/(h.length-1),y=v=>hh-4-(v-mn)/(mx-mn||1)*(hh-8);const up=h[h.length-1]>h[0];const col=up?'var(--warn)':h[h.length-1]<h[0]?'var(--ok)':'var(--muted)';return `<svg viewBox="0 0 ${w} ${hh}" width="${w}" height="${hh}" role="img" aria-label="Tendencia"><polyline points="${h.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="1.8"/><circle cx="${x(h.length-1)}" cy="${y(h[h.length-1])}" r="2.6" fill="${col}"/></svg>`}
function hbars(rows,unit=''){const mx=Math.max(...rows.map(r=>r[1]));return `<div class="stack" style="gap:8px">${rows.map(([l,v,s])=>`<div style="display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span>${bar(v/mx*100,s||'')}<span class="num" style="min-width:64px;text-align:right">${unit==='M'?mm(v):fmt(v)+unit}</span></div>`).join('')}</div>`}

const COND={'6 mm²':[3.08,'Cu'],'10 mm²':[1.83,'Cu'],'2 AWG':[.62,'Cu'],'1/0 AWG':[.39,'Cu'],'4/0 AWG':[.19,'Cu'],'250 kcmil':[.16,'Cu'],'350 kcmil':[.11,'Cu'],'500 kcmil':[.08,'Cu']};
function calcOut(){const c=S.calc,pn=EQX[c.pan],iv=EQX[c.inv];
 const voc=c.tcorr?pn.voc*(1+c.coef/100*(c.tmin-25)):pn.voc;const ser=Math.floor(iv.vmax/voc);const str=Math.ceil(c.np/ser);const spi=Math.ceil(str/c.ninv);const dc=c.np*pn.pmax/1000;const ac=iv.p*c.ninv;const I=iv.p*1000/(iv.vac*Math.sqrt(3));
 const Istr=pn.pmax/45.1;
 const rows=c.tr.map(([n,L,cond,np],i)=>{const R=COND[cond][0];const isDC=i===0;const cur=isDC?Istr:I;const vv=isDC?ser*45.1:iv.vac;const dv=isDC?(2*cur*L/1000*R/np)/vv*100:(Math.sqrt(3)*cur*L/1000*R/np)/vv*100;return {n,L,cond,np,cur,dv}});
 return `<div class="kpis">${kpi('Paneles por string',fmt(ser),`${fmt(iv.vmax)} V ÷ ${fmt(voc,2)} V = ${fmt(iv.vmax/voc,2)} → hacia abajo`)}${kpi('Strings totales',fmt(str),fmt(spi)+' por inversor')}${kpi('Potencia DC / AC',fmt(dc)+' / '+fmt(ac)+' kW','Relación '+fmt(dc/ac,2),dc/ac>1.35?'warn':'')}${kpi('Corriente AC por inversor',fmt(I,1)+' A','I = P ÷ (V × √3)')}</div>
 ${c.tcorr?note('info',`VOC corregido a ${c.tmin} °C: ${fmt(voc,2)} V (STC ${fmt(pn.voc,1)} V). Con la corrección caben ${ser} paneles en serie.`):note('','Método actual de Ambiente Solar: VOC en condiciones STC, redondeando siempre hacia abajo. Active la corrección por temperatura mínima del sitio para un cálculo más conservador.')}
